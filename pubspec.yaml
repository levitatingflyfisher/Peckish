name: peckish
description: The family food app — recipe box, weekly dinner plan, self-writing grocery list, and a one-tap food diary. Local-first — OpenHearth.
publish_to: 'none'
version: 0.9.1+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  go_router: ^14.2.7
  # Recipe URL import: fetch exactly the one page the user pasted.
  http: ^1.2.1
  uuid: ^4.4.2
  # Bumped from ^0.19.0: sanctuary_backup_ui (backup filename date formatting)
  # requires ^0.20.2.
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  # ── On-device rungs (Android; web/desktop get stub shims) ──────────────
  # EXACT pin, chosen by elimination (the whole story in ADR-0009):
  # 0.13.x drags sqlite3 ^3.1, which drift 2.28's WEB protocol can't
  # compile against (and the drift 2.34 road needs build ^3 → a
  # riverpod-3 migration); 0.12.6's own Kotlin no longer compiles (its
  # MediaPipe dep drifted under it); 1.0 stable needs Flutter >=3.44.
  # 1.0.0-rc.1 is the release that DROPPED the sqlite3/RAG machinery
  # while still building on Flutter 3.38. Loads ZIP .task bundles only —
  # never point it at raw "TFL3" flatbuffers. Bump deliberately.
  flutter_gemma: 1.0.0-rc.1
  # Snap-your-plate rung 1: ML Kit's bundled ~400-label classifier — in
  # Play Services, zero download, offline at analysis time.
  google_mlkit_image_labeling: ^0.15.0
  # Photo source for the plate rung (system picker/camera intent — adds no
  # manifest permissions of its own).
  image_picker: ^1.1.2
  # Resumable model downloads (Range + .part + atomic rename).
  dio: ^5.8.0
  # GB-scale downloads must survive the screen sleeping.
  wakelock_plus: ^1.5.2
  path: ^1.9.0
  # Offline barcode slices (ADR-0010): read-only sqlite lookups against the
  # downloaded USDA/OFF databases. Native only (io-conditional import); the
  # native lib is already linked via sqlite3_flutter_libs.
  sqlite3: ^2.9.4
  # SHA-256 check of downloaded barcode databases before install.
  crypto: ^3.0.3
  share_plus: ^10.0.3
  # Encrypted backup (SANCTUARY-BRIEF §4.W2) — sibling path deps, the eloEngine
  # precedent. file_picker is new (restore's "pick a .ohbk file" on every
  # platform); share_plus is already a dep (used by the plaintext export).
  # Shared design tokens/typography. Peckish is tier-T (zero visual change):
  # only the byte-identical Material TextTheme ladder comes from the package;
  # the jam/oat/butter identity stays app-local.
  openhearth_design:
    path: ../ohStyle/openhearth_design
  sanctuary_auth_core:
    path: ../packages/sanctuary_auth_core
  # The OpenHearth control plane for household AI: the shared resumable
  # download engine (model + barcode slices ride it) and the encrypted
  # stove protocol to a home server. Pure Dart; io-only files import it
  # behind the house trio idiom so web builds never compile dart:io.
  domovoi:
    path: ../DomovoiDiscernment
  sanctuary_backup_ui:
    path: ../packages/sanctuary_backup_ui
  file_picker: '>=8.0.0 <10.0.0'
  flutter_zxing: ^2.2.1
  flutter_secure_storage: ^9.2.4
  crdt: ^5.1.3
  shelf: ^1.4.2
  shelf_router: ^1.1.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#A85040"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FBF8F4"
    theme_color: "#A85040"

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0
  flutter_goldens:
    sdk: flutter
  # Fleet standards as failing-able tests (style grammar, backup envelope,
  # size budgets, permission surface, harness canon) — sibling path dep,
  # consumed by test/fleet_conformance_test.dart.
  oh_fleet_conformance:
    path: ../packages/oh_fleet_conformance

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/food/

  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
