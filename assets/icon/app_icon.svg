<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Peckish — a basalt ground with three courses of mortar-outlined drystone.
       Slight size variation between stones so it reads as masonry, not a grid. -->
  <rect width="1024" height="1024" rx="180" fill="#4E5D66"/>
  <g fill="none" stroke="#F2EEE6" stroke-width="30" stroke-linejoin="round">
    <!-- top course -->
    <rect x="210" y="240" width="290" height="150" rx="26"/>
    <rect x="550" y="240" width="264" height="150" rx="26"/>
    <!-- middle course (offset joints, running bond) -->
    <rect x="210" y="440" width="190" height="150" rx="26"/>
    <rect x="450" y="440" width="210" height="150" rx="26"/>
    <rect x="710" y="440" width="104" height="150" rx="26"/>
    <!-- bottom course -->
    <rect x="210" y="640" width="330" height="150" rx="26"/>
    <rect x="590" y="640" width="224" height="150" rx="26"/>
  </g>
</svg>
