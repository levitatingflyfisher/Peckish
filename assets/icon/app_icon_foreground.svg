    <rect x="210" y="240" width="290" height="150" rx="26"/>
    <rect x="550" y="240" width="264" height="150" rx="26"/>
    <rect x="210" y="440" width="190" height="150" rx="26"/>
    <rect x="450" y="440" width="210" height="150" rx="26"/>
    <rect x="710" y="440" width="104" height="150" rx="26"/>
    <rect x="210" y="640" width="330" height="150" rx="26"/>
    <rect x="590" y="640" width="224" height="150" rx="26"/>
  </g>
</svg>
